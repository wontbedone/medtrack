<style>
/* Layout: one full-height terminal window, scrollback above, live prompt at the bottom */
:root{
  /* neon city at night: violet-black ground, magenta and cyan signage, acid-yellow warnings */
  --bg:#0c0717; --fg:#e8e0ff; --dim:#8a7bb3; --rule:#2b1d4a;
  --amber:#ff3ecf; --cyan:#22e4ff; --red:#ff5277; --ok:#3dffb0; --warn:#f6ff4a;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg) radial-gradient(120% 70% at 50% 0%,#1d0b38 0%,transparent 70%) no-repeat;color:var(--fg);font:15px/1.55 var(--mono);margin:0}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.term{height:var(--app-h,100%);display:flex;flex-direction:column;box-sizing:border-box;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:900px;margin:0 auto}
.bar{display:flex;gap:7px;align-items:center;color:var(--dim);font-size:12px;padding-bottom:10px;border-bottom:1px solid var(--amber);box-shadow:0 6px 12px -10px var(--amber);margin-bottom:10px}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber);display:inline-block}
.bar i:nth-child(2){background:var(--cyan);box-shadow:0 0 6px var(--cyan)} .bar i:nth-child(3){background:var(--warn);box-shadow:0 0 6px var(--warn)}
.bar span{letter-spacing:.04em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar b{font-weight:600}
.bar .mark{width:16px;height:16px;margin-left:8px}
.head{display:flex;gap:14px;align-items:center;white-space:normal;margin:2px 0 6px}
.kv{display:grid;grid-template-columns:12ch 1fr;column-gap:1ch;white-space:normal;padding-left:2ch}
.kv>:nth-child(odd){color:var(--dim)}
.cmds{grid-template-columns:13ch 1fr}
.cmds>:nth-child(odd){color:var(--fg)}
.cmds>:nth-child(even){color:var(--dim)}
.logo{display:block;width:84px;height:auto;flex:none;opacity:.9}
#out{flex:1;overflow:auto;white-space:pre;min-width:0;font-variant-numeric:tabular-nums}
.line{min-height:1.55em}
.typing::after{content:"▌";color:var(--amber);text-shadow:0 0 8px rgba(255,62,207,.55)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{white-space:pre-wrap;word-break:break-word}
.dim{color:var(--dim)} .amb{color:var(--amber)} .cy{color:var(--cyan)} .red{color:var(--red)} .ok{color:var(--ok)}
.b{font-weight:600}
.amb.b,.ps{text-shadow:0 0 8px rgba(255,62,207,.55)} .cy.b{text-shadow:0 0 8px rgba(34,228,255,.5)}

<script>
const out=document.getElementById('out'), inp=document.getElementById('in'), ps=document.getElementById('ps');
const DAYS=['sun','mon','tue','wed','thu','fri','sat'];
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const KEY='medtrack.v4', OLDKEYS=['medtrack.v3','medtrack.v2','medtrack.v1'];

/* ---------- output helpers ---------- */
// Replies are typed out: each line is built in full, then its text is revealed a few characters per frame.
// Short replies type at a steady pace; long ones speed up so they finish in about a second.
// Reduced-motion settings, or a browser without the features needed, get instant output.
const sr=document.getElementById('sr');
const animate=typeof requestAnimationFrame==='function'&&!!document.createTreeWalker&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const queue=[]; let backlog=0, carry=0, typing=false, srText='';
function print(html,cls,instant){
  const d=document.createElement('div');d.className='line '+(cls||'');d.innerHTML=html;
  srText+=d.textContent+'\n';
  if(!animate||instant){out.appendChild(d);out.scrollTop=out.scrollHeight;return}
  const texts=[], w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);
  for(let n;(n=w.nextNode());){texts.push([n,n.data]);backlog+=n.data.length;n.data=''}
  queue.push({d,texts});
  if(!typing){typing=true;requestAnimationFrame(tick)}
}
function tick(){
  carry+=Math.max(1.2,backlog/50); let budget=Math.floor(carry); carry-=budget;
  while(queue.length){
    const job=queue[0];
    if(!job.d.parentNode){out.appendChild(job.d);if(!job.d.querySelector('div'))job.d.classList.add('typing')} // no cursor on two-column blocks
    while(job.texts.length&&budget>0){
      const [node,full]=job.texts[0], n=Math.min(budget,full.length-node.data.length);
      node.data=full.slice(0,node.data.length+n); budget-=n; backlog-=n;
      if(node.data.length===full.length)job.texts.shift();
    }
    while(job.texts.length&&!job.texts[0][1].length)job.texts.shift();
    if(job.texts.length)break;
    job.d.classList.remove('typing'); queue.shift();
  }
  out.scrollTop=out.scrollHeight;
  if(queue.length)requestAnimationFrame(tick); else {typing=false;carry=0}
}
// Shows everything still being typed straight away.
function finish(){
  for(const {d,texts} of queue){if(!d.parentNode)out.appendChild(d);texts.forEach(([n,full])=>n.data=full);d.classList.remove('typing')}
  queue.length=0; backlog=0; out.scrollTop=out.scrollHeight;
}
function wipe(){queue.length=0;backlog=0;out.innerHTML=''}
// Screen readers get each reply once, in full, rather than letter by letter.
function announce(){if(srText.trim())sr.textContent=srText.trim();srText=''}
// "1 patches" reads as "1 patch".
const one=u=>/(ch|sh|x|ss)es$/i.test(u)?u.slice(0,-2):/[^s]s$/i.test(u)?u.slice(0,-1):u;
const qty=(n,u)=>n+' '+(n===1?one(u):u);
const say=h=>print(h,'wrap');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const narrow=()=>window.matchMedia&&matchMedia('(max-width:600px)').matches;
const pad=(s,n)=>{s=String(s);return s.length>=n?s.slice(0,n-2)+'… ':s+' '.repeat(n-s.length)};

/* ---------- dates ---------- */
const startOf=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const today=()=>startOf(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((startOf(b)-startOf(a))/864e5);
const fmt=d=>d.toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function parseDate(v){
  v=v.trim().toLowerCase(); const t=today();
  if(v==='today')return t;
  if(v==='tomorrow'||v==='tmr')return addDays(t,1);
  if(/^[a-z]+$/.test(v)){const wd=DAYS.findIndex(d=>v.startsWith(d));if(wd>=0)return addDays(t,(wd-t.getDay()+7)%7)}
  const m=v.match(/^(\d{1,2})\s*[\/\-. ]\s*(\d{1,2}|[a-z]{3,})(?:\s*[\/\-. ]\s*(\d{2,4}))?$/);
  if(m){
    const day=+m[1], mon=/^\d/.test(m[2])?+m[2]-1:MONTHS.indexOf(m[2].slice(0,3));
    if(mon<0||mon>11||day<1||day>31)return;
    let yr=m[3]?+m[3]:t.getFullYear(); if(yr<100)yr+=2000;
    let d=new Date(yr,mon,day); if(d.getMonth()!==mon)return;
    if(!m[3]&&diff(t,d)<-180)d=new Date(yr+1,mon,day);
    return d;
  }
}

/* ---------- storage ---------- */
let meds=[];
// Only name, unit and dose are saved. Schedules and amounts on hand stay in this page and are gone when it closes.
const plan=m=>({name:m.name,unit:m.unit,dose:m.dose});
// saving off is remembered (only the word "off", under NOSAVE). forget pauses saving until the page closes.
const NOSAVE='medtrack.nosave';
let savingOff=false, paused=false;
function save(){if(savingOff||paused)return;try{localStorage.setItem(KEY,JSON.stringify(meds.map(plan)))}catch(e){}}
function load(){
  try{savingOff=localStorage.getItem(NOSAVE)==='1'}catch(e){}
  if(savingOff){try{[KEY,...OLDKEYS].forEach(k=>localStorage.removeItem(k))}catch(e){}return []}
  let v=null;
  try{v=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!Array.isArray(v)){ // earlier versions saved more: keep names, units and doses, then delete the old copies
    for(const k of OLDKEYS.slice(0,2))if(!Array.isArray(v))try{v=JSON.parse(localStorage.getItem(k))}catch(e){}
    if(!Array.isArray(v))try{const o=JSON.parse(localStorage.getItem(OLDKEYS[2]));
      if(o&&o.days)v=[{name:'Patches',unit:'patches',dose:o.perChange},{name:'Pills',unit:'pills',dose:o.perDay}]}catch(e){}
    if(!Array.isArray(v))v=[];
    try{localStorage.setItem(KEY,JSON.stringify(v.map(plan)));OLDKEYS.forEach(k=>localStorage.removeItem(k))}catch(e){}
  }
  return v.map(m=>({...plan(m),sched:null,stock:null,asOf:+today(),doneToday:false}));
}

/* ---------- schedule maths ---------- */
const mod=(a,n)=>((a%n)+n)%n;
const r3=n=>Math.round(n*1000)/1000;
const ready=m=>m.sched!=null&&m.stock!=null;
function isDoseDay(m,d){
  const s=m.sched;
  if(s.type==='daily')return true;
  if(s.type==='weekly')return s.days.includes(d.getDay());
  const k=diff(new Date(s.anchor),d);
  if(s.type==='interval')return k>=0&&k%s.every===0;
  if(s.type==='cycle')return mod(k,s.on+s.off)<s.on;
  return false;
}
function schedText(s){
  if(!s)return 'schedule not entered';
  if(s.type==='daily')return 'every day';
  if(s.type==='weekly')return s.days.length===7?'every day':[1,2,3,4,5,6,0].filter(i=>s.days.includes(i)).map(i=>DAYS[i]).join(' ');
  if(s.type==='interval')return s.every===2?'every other day':'every '+s.every+' days';
  if(s.type==='cycle')return s.on+' days on, '+s.off+' off';
}
// Walk forward from the day the stock was counted, using a dose on each dose day.
function forecast(m){
  let left=m.stock, last=null, outD=null, d=startOf(new Date(m.asOf));
  for(let i=0;i<40000;i++){
    if(isDoseDay(m,d)&&!(i===0&&m.doneToday)){
      if(left<m.dose){outD=d;break}
      left=r3(left-m.dose); last=d;
    }
    d=addDays(d,1);
  }
  return {last,out:outD,left};
}
// Amount on hand at the start of today: count date stock minus doses on the days in between.
function onHandNow(m){
  let left=m.stock, d=startOf(new Date(m.asOf)); const t=today();
  for(let i=0;diff(d,t)>0&&i<40000;i++){
    if(isDoseDay(m,d)&&!(i===0&&m.doneToday)&&left>=m.dose)left=r3(left-m.dose);
    d=addDays(d,1);
  }
  return left;
}
// Amount at the start of today, before today's dose.
function startStock(m){
  let s=onHandNow(m);
  if(diff(new Date(m.asOf),today())===0&&m.doneToday)s=r3(s+m.dose);
  return s;
}
// Move the count date to today. Stock is counted after today's dose when doneToday is true.
function reanchor(m,s,done){m.stock=done?Math.max(0,r3(s-m.dose)):s;m.asOf=+today();m.doneToday=!!done}

/* ---------- reports ---------- */
// Dates 5 and 4 weeks before a run-out date, dimmed once they have passed.
function weeksBefore(d,lbl){
  const t=today();
  [5,4].forEach(w=>{
    const x=addDays(d,-7*w), past=diff(t,x)<0, isToday=diff(t,x)===0;
    const wk=' <span class="dim">· week of</span> '+(past?'<span class="dim">':'<span class="amb">')+fmt(addDays(x,-((x.getDay()+6)%7)))+'</span>';
    print(lbl(w+' weeks before')+(past?'<span class="dim">'+fmt(x)+' (passed)</span>':'<span class="b amb">'+fmt(x)+'</span>'+(isToday?' <span class="amb">(today)</span>':' <span class="dim">(in '+diff(t,x)+(diff(t,x)===1?' day':' days')+')</span>'))+wk);
  });
}
function list(){
  if(!meds.length){say('<span class="dim">No medications yet. Type </span>add<span class="dim"> to add one.</span>');return}
  const amt=m=>ready(m)?qty(onHandNow(m),m.unit):'not entered';
  if(narrow()){meds.forEach((m,i)=>{print('');say('  <span class="amb">'+(i+1)+'</span> '+esc(m.name));say('    <span class="dim">on hand</span> '+esc(amt(m))+'<span class="dim"> · dose</span> '+esc(qty(m.dose,m.unit))+'<span class="dim"> · </span><span class="cy">'+esc(schedText(m.sched))+'</span>')});return}
  print('');
  print('<span class="dim">  #  '+pad('name',18)+pad('on hand',14)+pad('dose',12)+'schedule</span>');
  meds.forEach((m,i)=>{
    print('  <span class="amb">'+(i+1)+'</span>  '+esc(pad(m.name,18))+esc(pad(amt(m),14))+esc(pad(qty(m.dose,m.unit),12))+'<span class="cy">'+esc(schedText(m.sched))+'</span>');
  });
}
function report(){
  if(!meds.length){list();return}
  const t=today(), lbl=s=>'<span class="dim">    '+pad(s,19)+'</span>';
  const rows=meds.map(m=>({m,f:ready(m)?forecast(m):null}));
  print('');
  print('<span class="dim">── forecast · '+fmt(t)+' ──────────────────────</span>');
  rows.forEach(({m,f},i)=>{
    print('');
    print('  <span class="amb">'+(i+1)+'</span> <span class="cy b">'+esc(m.name)+'</span>  <span class="dim">'+esc(qty(m.dose,m.unit)+', '+schedText(m.sched))+'</span>');
    if(!f){print(lbl('not set up')+'<span class="dim">type </span>setup '+(i+1));return}
    if(!f.out){print(lbl('out by')+'<span class="ok">more than 100 years away</span>');return}
    print(lbl('last full dose')+(f.last?'<span class="b ok">'+fmt(f.last)+'</span>':'<span class="red">none, you are already short</span>'));
    const ago=diff(f.out,t);
    print(lbl(ago>0?'ran out':'out by')+'<span class="b red">'+fmt(f.out)+'</span> <span class="dim">('+(ago>0?ago+' day'+(ago>1?'s':'')+' ago':'next dose due')+', only '+f.left+' of '+esc(qty(m.dose,m.unit))+' left)</span>');
    weeksBefore(f.out,lbl);
  });
  const outs=rows.filter(r=>r.f&&r.f.out).sort((a,b)=>a.f.out-b.f.out);
  if(outs.length){
    const first=outs[0], last=outs[outs.length-1];
    print('');
    print('  <span class="cy b">all medications</span>');
    print(lbl('fully covered to')+'<span class="b ok">'+fmt(addDays(first.f.out,-1))+'</span>');
    if(outs.length>1){
      print(lbl('first out')+'<span class="b red">'+fmt(first.f.out)+'</span> <span class="dim">('+esc(first.m.name)+')</span>');
      weeksBefore(first.f.out,lbl);
      print(lbl('everything out by')+'<span class="b red">'+fmt(last.f.out)+'</span> <span class="dim">('+esc(last.m.name)+')</span>');
      weeksBefore(last.f.out,lbl);
      const gap=diff(first.f.out,last.f.out);
      say(gap?'<span class="dim">    For </span><span class="b">'+gap+' day'+(gap>1?'s':'')+'</span><span class="dim"> some medications will have run out while others remain.</span>'
             :'<span class="dim">    Everything runs out on the same day. One reorder covers it all.</span>');
    }
    warn(first);
  }
  print('');
  say('<span class="dim">type </span>help<span class="dim"> for commands</span>');
}

// Reorder warning for whichever medication runs out first.
function warn(first){
  const t=today();
  const soon=diff(t,first.f.out);
  if(soon<0)say('<span class="red">  ! '+esc(first.m.name)+' ran out on '+fmt(first.f.out)+'.</span> <span class="dim">Type </span>refill<span class="dim"> if you have a new supply, or </span>setup<span class="dim"> to correct the amount on hand.</span>');
  else if(soon<=7)say('<span class="red">  ! '+esc(first.m.name)+' runs out in under a week. Reorder now.</span>');
  else if(soon<=14)say('<span style="color:var(--warn)">  ! '+esc(first.m.name)+' runs out in under two weeks. Good time to reorder.</span>');
}
// Short forecast: one line per medication. show all gives every date.
function summary(){
  if(!meds.length){list();return}
  const t=today(), sd=d=>d.getFullYear()===t.getFullYear()?fmt(d).replace(/ \d{4}$/,''):fmt(d);
  const w=narrow()?0:Math.min(18,Math.max(...meds.map(m=>m.name.length))+2);
  const rows=meds.map(m=>({m,f:ready(m)?forecast(m):null}));
  print('');
  print('<span class="dim">── forecast · '+fmt(t)+' ──────────────────────</span>');
  rows.forEach(({m,f},i)=>{
    let s='  <span class="amb">'+(i+1)+'</span> <span class="cy b">'+esc(w?pad(m.name,w):m.name+'  ')+'</span>';
    if(!f)s+='<span class="dim">not set up · type </span>setup '+(i+1);
    else if(!f.out)s+='<span class="ok">enough for over 100 years</span>';
    else{
      s+='<span class="dim">'+(diff(f.out,t)>0?'ran out ':'out ')+'</span><span class="b red">'+sd(f.out)+'</span>';
      [5,4].forEach(w=>{const x=addDays(f.out,-7*w);s+=' <span class="dim">· '+w+' wk </span>'+(diff(t,x)<0?'<span class="dim">'+sd(x)+'</span>':'<span class="amb">'+sd(x)+'</span>')});
    }
    say(s);
  });
  const outs=rows.filter(r=>r.f&&r.f.out).sort((a,b)=>a.f.out-b.f.out);
  if(outs.length){
    print('');
    say('  <span class="dim">all covered to</span> <span class="b ok">'+sd(addDays(outs[0].f.out,-1))+'</span>'+(outs.length>1?'<span class="dim"> · '+esc(outs[0].m.name)+' runs out first</span>':''));
    warn(outs[0]);
  }
  print('');
  say('<span class="dim">type </span>show all<span class="dim"> for every date, or </span>help<span class="dim"> for commands</span>');
}

/* ---------- question engine ---------- */
let flow=null;
function runFlow(steps,ctx,done){flow={steps,i:0,ctx,done};next()}
function next(){
  const f=flow;
  while(f.i<f.steps.length&&f.steps[f.i].when&&!f.steps[f.i].when(f.ctx))f.i++;
  if(f.i>=f.steps.length){flow=null;ps.textContent='$';f.done(f.ctx);return}
  const s=f.steps[f.i], q=typeof s.q==='function'?s.q(f.ctx):s.q;
  print('');say('<span class="cy">?</span> '+q); ps.textContent='>';
}
// These work even in the middle of a question; the question is asked again afterwards.
// Any of these stops the current question and leaves everything as it was.
const CANCEL=['cancel','stop','quit','exit','abort'];
const ANYTIME=['help','?','clear','test','demo','show','show all','forecast','list','ls','changelog','log','version','versions','about'];
function answer(v){
  const s=flow.steps[flow.i], w=v.trim().toLowerCase();
  if(CANCEL.includes(w)){flow=null;ps.textContent='$';say('<span class="dim">Cancelled. Nothing changed.</span>');return}
  if(ANYTIME.includes(w)){command(w);next();return}
  const val=s.p(v,flow.ctx);
  if(val===undefined){say('<span class="red">'+(typeof s.err==='function'?s.err(flow.ctx):s.err)+'</span>');return}
  s.set(flow.ctx,val); flow.i++; next();
}
const intP=min=>v=>{const n=Number(v.trim());return v.trim()!==''&&Number.isInteger(n)&&n>=min?n:undefined};
// Whole numbers, decimals (2.5 or 2,5) or a fraction like 1/2.
const numP=(min,above)=>v=>{v=v.trim().replace(',','.');const f=v.match(/^(\d+)\s*\/\s*(\d+)$/);
  const n=f?+f[1]/+f[2]:/^\d*\.?\d+$/.test(v)?+v:NaN;return isFinite(n)&&(above?n>min:n>=min)?r3(n):undefined};
const yn=v=>{v=v.trim().toLowerCase();if(/^y(es)?$/.test(v))return true;if(/^no?$/.test(v))return false};
const textP=v=>{v=v.trim();return v&&v.length<=40?v:undefined};
function parseDays(v){
  v=v.toLowerCase().trim();
  if(v==='weekdays')return [1,2,3,4,5]; if(v==='weekends')return [0,6];
  const toks=v.split(/[\s,\/&+]+|\band\b/).filter(Boolean), set=new Set();
  for(const tk of toks){
    const i=DAYS.findIndex(d=>tk.startsWith(d)); if(i>=0){set.add(i);continue}
    if(/^[1-7]$/.test(tk)){set.add(+tk%7);continue}
    return;
  }
  return set.size?[...set].sort():undefined;
}
const SCHED={'1':'daily','2':'weekly','3':'interval','4':'cycle'};
const doneQ='Today is a dose day. Have you already had today’s dose? <span class="dim">(y/n)</span>';

// Schedule questions, shared by add and edit. Sets ctx.s and ctx.doneToday.
function scheduleSteps(){
  return [
    {q:'How often?\n  <span class="amb">1</span> every day\n  <span class="amb">2</span> on certain days of the week\n  <span class="amb">3</span> every few days <span class="dim">(every other day, every 3 days…)</span>\n  <span class="amb">4</span> in a cycle <span class="dim">(e.g. 21 days on, 7 off)</span>',
     p:v=>SCHED[v.trim()],err:'Type 1, 2, 3 or 4.',set:(c,v)=>{c.s={type:v};c.doneToday=false}},
    {when:c=>c.s.type==='weekly',q:'Which days? <span class="dim">(e.g. mon thu, or weekdays)</span>',p:parseDays,err:'Use day names like mon thu, or numbers 1–7 (1 = Monday).',set:(c,v)=>c.s.days=v},
    {when:c=>c.s.type==='interval',q:'Every how many days? <span class="dim">(2 = every other day)</span>',p:intP(2),err:'Enter a whole number of 2 or more.',set:(c,v)=>c.s.every=v},
    {when:c=>c.s.type==='interval',q:'When is the next dose due? <span class="dim">(today, tomorrow, fri, or a date like 12 nov)</span>',
     p:v=>{const d=parseDate(v);return d&&diff(today(),d)>=0&&diff(today(),d)<366?d:undefined},err:'Enter today, tomorrow, a weekday, or a date that hasn’t passed, like 12 nov.',
     set:(c,v)=>c.s.anchor=+v},
    {when:c=>c.s.type==='cycle',q:'How many days on?',p:intP(1),err:'Enter a whole number of 1 or more.',set:(c,v)=>c.s.on=v},
    {when:c=>c.s.type==='cycle',q:'How many days off?',p:intP(1),err:'Enter a whole number of 1 or more.',set:(c,v)=>c.s.off=v},
    {when:c=>c.s.type==='cycle',q:c=>'Which day of the cycle is today? <span class="dim">(1–'+(c.s.on+c.s.off)+'; days 1–'+c.s.on+' are dose days)</span>',
     p:(v,c)=>{const n=intP(1)(v);return n&&n<=c.s.on+c.s.off?n:undefined},err:c=>'Enter a number from 1 to '+(c.s.on+c.s.off)+'.',
     set:(c,v)=>c.s.anchor=+addDays(today(),-(v-1))},
    {when:c=>c.s.type!=='interval'&&isDoseDay({sched:c.s},today()),q:doneQ,p:yn,err:'Answer y or n.',set:(c,v)=>c.doneToday=v},
  ];
}
const todayStep=m=>({when:()=>m.sched!=null&&isDoseDay(m,today()),q:doneQ,p:yn,err:'Answer y or n.',set:(c,v)=>c.doneToday=v});
const nameStep={q:'Medication name? <span class="dim">(e.g. Estradiol patch)</span>',p:textP,err:'Enter a name up to 40 characters.',set:(c,v)=>c.name=v};
const unitStep={q:'What do you count it in? <span class="dim">(pills, patches, ml… or press enter for "doses")</span>',p:v=>{v=v.trim();return v===''?'doses':v.length<=12?v:undefined},err:'Keep it under 12 characters.',set:(c,v)=>c.unit=v};
const stockStep={q:c=>'How many '+esc(c.unit)+' do you have right now?',p:numP(0),err:'Enter a number, like 30 or 12.5.',set:(c,v)=>c.stock=v};
const doseStep={q:c=>'How many '+esc(c.unit)+' each dose?',p:numP(0,true),err:'Enter a number above 0, like 1, 2.5 or 1/2.',set:(c,v)=>c.dose=v};
const ynStep=(q,k)=>({q:q+' <span class="dim">(y/n)</span>',p:yn,err:'Answer y or n.',set:(c,v)=>c[k]=v});

// The amount alone, or the amount and a simple schedule in one go, like "8 mon thu" or "30 daily".
const quickP=v=>{
  const m=v.trim().match(/^(\S+)(?:\s+(.+))?$/); if(!m)return;
  const n=numP(0)(m[1]); if(n===undefined)return;
  if(!m[2])return {n};
  const r=m[2].trim().toLowerCase();
  if(/^(daily|every ?day|each day)$/.test(r))return {n,s:{type:'daily'}};
  const days=parseDays(r); return days?{n,s:{type:'weekly',days}}:undefined;
};
const quickStep={q:c=>'How many '+esc(c.unit)+' do you have right now? <span class="dim">(or add the days too, like 8 mon thu or 30 daily)</span>',
  p:quickP,err:'Enter a number like 30, or a number and days like 8 mon thu.',set:(c,v)=>{c.stock=v.n;if(v.s){c.s=v.s;c.quick=true;c.doneToday=false}}};
// Asks for what isn't saved: the amount on hand, and the schedule if it hasn't been given since the page opened.
// One medication at a time, so cancelling keeps the ones already finished.
function setup(list,then){
  if(!list.length)return then();
  const [m,...rest]=list;
  print('');say('<span class="cy b">'+esc(m.name)+'</span> <span class="dim">· '+esc(qty(m.dose,m.unit))+' each dose</span>');
  const sched=scheduleSteps().map((st,k,all)=>k<all.length-1?{...st,when:c=>!c.quick&&(!st.when||st.when(c))}:st);
  runFlow(m.sched?[stockStep,todayStep(m)]:[quickStep,...sched],{unit:m.unit},c=>{
    if(c.s)m.sched=c.s; m.stock=c.stock; m.asOf=+today(); m.doneToday=!!c.doneToday;
    setup(rest,then);
  });
}

function addMed(then){
  say('<span class="dim">Adding a medication. Type </span>cancel<span class="dim"> or </span>stop<span class="dim">, or press Esc, at any point to back out.</span>');
  runFlow([nameStep,unitStep,stockStep,doseStep,...scheduleSteps(),ynStep('Add another medication?','more')],{},c=>{
    meds.push({name:c.name,unit:c.unit,stock:c.stock,dose:c.dose,sched:c.s,asOf:+today(),doneToday:!!c.doneToday});
    save(); say('<span class="ok">Added '+esc(c.name)+'.</span>');
    if(c.more)addMed(then); else (then||summary)();
  });
}

function pick(arg){
  arg=(arg||'').trim().toLowerCase(); if(!arg)return -1;
  if(/^\d+$/.test(arg)){const i=+arg-1;return i>=0&&i<meds.length?i:-2}
  const i=meds.findIndex(m=>m.name.toLowerCase().startsWith(arg));
  return i>=0?i:-2;
}
// Commands that act on one medication ask which one when none was given.
function withMed(arg,verb,fn){
  if(!meds.length){say('<span class="red">No medications yet.</span> Type <span class="b">add</span> to add one.');return}
  const i=pick(arg);
  if(i===-2){say('<span class="red">No medication matches "'+esc(arg)+'".</span> Type <span class="b">list</span> to see the numbers.');return}
  if(i>=0||meds.length===1){fn(i>=0?i:0);return}
  list();
  runFlow([{q:'Which one do you want to '+verb+'? <span class="dim">(number or name)</span>',p:v=>{const j=pick(v);return j>=0?j:undefined},err:'Enter a number from the list or the start of a name.',set:(c,v)=>c.i=v}],{},c=>fn(c.i));
}

function removeMed(i,then){
  runFlow([ynStep('Remove <span class="b">'+esc(meds[i].name)+'</span>?','ok')],{},x=>{
    if(x.ok){const m=meds.splice(i,1)[0];removed={m,i};save();say('<span class="ok">Removed '+esc(m.name)+'.</span> <span class="dim">Type </span>undo<span class="dim"> to bring it back.</span>')}
    else say('<span class="dim">Kept it.</span>');
    if(then)then();
  });
}

// begin: the starting point. With nothing saved it adds medications. With saved ones it lists them,
// asks whether anything needs changing, then asks for today's amounts and schedules.
function savedList(){meds.forEach((m,i)=>say('  <span class="amb">'+(i+1)+'</span> '+esc(m.name)+' <span class="dim">· '+esc(qty(m.dose,m.unit))+' each dose</span>'))}
function begin(){
  if(!meds.length){say('<span class="dim">Let’s add your medications. Type </span>cancel<span class="dim"> at any point to stop.</span>');return addMed()}
  print('');
  say('<span class="dim">You have </span>'+meds.length+' medication'+(meds.length>1?'s':'')+'<span class="dim"> saved:</span>');
  savedList();
  runFlow([ynStep('Is this still right?','ok')],{},x=>x.ok?carryOn():changes());
}
function changes(){
  const PICK={'1':'add','2':'edit','3':'remove','4':'done'};
  runFlow([{q:'What needs changing?\n  <span class="amb">1</span> add a medication\n  <span class="amb">2</span> edit one\n  <span class="amb">3</span> remove one\n  <span class="amb">4</span> nothing else, carry on',
    p:v=>PICK[v.trim()],err:'Type 1, 2, 3 or 4.',set:(c,v)=>c.pick=v}],{},c=>{
    if(c.pick==='add')return addMed(changed);
    if(c.pick==='done')return carryOn();
    if(!meds.length){say('<span class="dim">There are no medications to change.</span>');return changes()}
    if(c.pick==='edit')return withMed('','edit',i=>editMed(i,changed));
    withMed('','remove',i=>removeMed(i,changed));
  });
}
// After each change, show the list as it is now and offer more changes.
function changed(){if(meds.length){print('');savedList()}changes()}
function carryOn(){
  if(!meds.length)return say('<span class="dim">No medications saved. Type </span>begin<span class="dim"> to add some.</span>');
  const todo=meds.filter(m=>!ready(m));
  if(todo.length)say('<span class="dim">Now today’s amounts'+(todo.some(m=>!m.sched)?' and schedules':'')+'.</span>');
  setup(todo,summary);
}

function editMed(i,then){
  const m=meds[i];
  const FIELDS={'1':'name','2':'stock','3':'dose','4':'sched','5':'unit'};
  runFlow([{q:'Change what for <span class="b">'+esc(m.name)+'</span>?\n  <span class="amb">1</span> name\n  <span class="amb">2</span> amount on hand\n  <span class="amb">3</span> dose\n  <span class="amb">4</span> schedule\n  <span class="amb">5</span> unit',
    p:v=>FIELDS[v.trim()],err:'Type 1–5.',set:(c,v)=>c.field=v}],{},c=>{
    const done=()=>{save();say('<span class="ok">Updated '+esc(m.name)+'.</span>');(then||summary)()};
    switch(c.field){
      case 'name': return runFlow([nameStep],{},x=>{m.name=x.name;done()});
      case 'unit': return runFlow([unitStep],{},x=>{m.unit=x.unit;done()});
      case 'dose': return runFlow([doseStep,todayStep(m)],{unit:m.unit},x=>{if(ready(m)){const st=startStock(m);m.dose=x.dose;reanchor(m,st,x.doneToday)}else m.dose=x.dose;done()});
      case 'stock': return runFlow([stockStep,todayStep(m)],{unit:m.unit},x=>{m.stock=x.stock;m.asOf=+today();m.doneToday=!!x.doneToday;done()});
      case 'sched': return runFlow(scheduleSteps(),{},x=>{if(ready(m)){const st=startStock(m);m.sched=x.s;reanchor(m,st,x.doneToday)}else m.sched=x.s;done()});
    }
  });
}

function changelog(){
  const tag={add:'<span class="ok">+ added  </span>',change:'<span class="cy">~ changed</span>',fix:'<span class="red">! fixed  </span>'};
  print('');
  print('<span class="dim">── changelog ──────────────────────────────</span>');
  // Oldest first, so the current version ends up just above the prompt.
  [...CHANGELOG].reverse().forEach(([v,d,was,items],i,all)=>{
    print('');
    print('<span class="amb b">'+v+'</span>  <span class="dim">'+d+(was?' · was '+was:'')+(i===all.length-1?' · current':'')+'</span>');
    items.forEach(([k,t])=>say('  '+tag[k]+' '+esc(t)));
  });
}

// Made-up medications, shown without touching your saved list.
function demo(){
  const T=+today(), a=n=>+addDays(today(),n);
  const sample=[
    {name:'Novaline',unit:'tablets',stock:46,dose:2,sched:{type:'daily'},asOf:T,doneToday:true},
    {name:'Zentrix patch',unit:'patches',stock:16,dose:1,sched:{type:'weekly',days:[1,4]},asOf:T,doneToday:true},
    {name:'Calderol',unit:'capsules',stock:9,dose:1,sched:{type:'interval',every:3,anchor:a(1)},asOf:T,doneToday:false},
    {name:'Vexamide',unit:'pills',stock:30,dose:1,sched:{type:'cycle',on:21,off:7,anchor:a(-5)},asOf:T,doneToday:true},
    {name:'Drexil gel',unit:'ml',stock:40,dose:2.5,sched:{type:'interval',every:2,anchor:T},asOf:T,doneToday:true},
  ];
  const mine=meds; meds=sample;
  print('');
  say('<span style="color:var(--warn)" class="b">▲ TEST MODE</span> <span class="dim">made-up medications and dates. Your saved list is untouched.</span>');
  try{ list(); report(); }
  finally{ meds=mine; }
  say('<span style="color:var(--warn)">▼ end of test.</span> <span class="dim">Type </span>show<span class="dim"> for your own forecast.</span>');
}

// Puts the run-out and 4 and 5 week dates on the clipboard as plain text, ready to paste into a calendar.
function copyDates(){
  const rows=meds.filter(ready).map(m=>({m,f:forecast(m)})).filter(r=>r.f.out);
  if(!rows.length)return say('<span class="dim">Nothing to copy yet. Enter amounts and schedules first with </span>setup<span class="dim">.</span>');
  const text=rows.map(({m,f})=>m.name+'\n  out by '+fmt(f.out)+'\n  5 weeks before: '+fmt(addDays(f.out,-35))+'\n  4 weeks before: '+fmt(addDays(f.out,-28))).join('\n\n');
  const report=ok=>{say(ok?'<span class="ok">Copied the dates for '+rows.length+' medication'+(rows.length>1?'s':'')+'.</span> <span class="dim">Paste them into a Calendar event.</span>'
    :'<span class="red">Couldn’t copy automatically.</span> <span class="dim">Select the dates above and copy them.</span>');announce()};
  const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
    const ok=document.execCommand('copy');ta.remove();inp.focus();return ok}catch(e){return false}};
  print('');say('<span class="dim">'+esc(text)+'</span>');
  if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>report(true),()=>report(fallback()));
  else report(fallback());
}

}
// The last medication removed, so undo can put it back. Kept only while the page is open.
let removed=null;
function command(v){
  const [c0,...rest]=v.trim().split(/\s+/), c=(c0||'').toLowerCase(), arg=rest.join(' ');
  if(!c)return;
  if(CANCEL.includes(c))return say('<span class="dim">Nothing to cancel.</span>');
  if(c==='help'||c==='?')return help();
  if(c==='clear'){wipe();banner();return say('<span class="dim">type </span>help<span class="dim"> for commands</span>')}
  if(c==='about')return about();
  if(c==='show'||c==='forecast')return /^(all|full)$/i.test(arg)?report():summary();
  if(c==='list'||c==='ls')return list();
  if(c==='setup'||c==='count'||c==='amount'||c==='amounts'){
    if(!meds.length)return say('<span class="red">No medications yet.</span> Type <span class="b">add</span> to add one.');
    return arg?withMed(arg,'set up',i=>setup([meds[i]],summary)):setup(meds,summary);
  }
  if(c==='test'||c==='demo')return demo();
  if(c==='changelog'||c==='log'||c==='version'||c==='versions')return changelog();
  if(c==='begin'||c==='start')return begin();
  if(c==='add'||c==='new')return addMed();
  if(c==='edit'||c==='change')return withMed(arg,'edit',editMed);
  if(c==='rename')return withMed(arg,'rename',i=>runFlow([nameStep],{},x=>{const o=meds[i].name;meds[i].name=x.name;save();say('<span class="ok">Renamed '+esc(o)+' to '+esc(x.name)+'.</span>')}));
  // Refill moves the count date to today, so days spent already run out aren't charged against the new supply.
  if(c==='refill')return withMed(arg,'refill',i=>{const m=meds[i];if(!ready(m))return setup([m],summary);runFlow([{q:'How many '+esc(m.unit)+' did you get for '+esc(m.name)+'?',p:numP(0,true),err:'Enter a number above 0, like 30 or 12.5.',set:(x,n)=>x.n=n},todayStep(m)],{},x=>{reanchor(m,r3(startStock(m)+x.n),x.doneToday);save();say('<span class="ok">Added '+esc(qty(x.n,m.unit))+'. '+esc(qty(onHandNow(m),m.unit))+' on hand now.</span>');summary()})});
  if(c==='remove'||c==='rm'||c==='delete')return withMed(arg,'remove',i=>removeMed(i));
  if(c==='copy')return copyDates();
  if(c==='forget'){
    try{localStorage.removeItem(KEY)}catch(e){} paused=true;
    return say('<span class="ok">Deleted the saved names from this browser.</span> <span class="dim">They stay in this page until you close it, and nothing more is saved until then. Type </span>saving off<span class="dim"> to never save, or </span>saving on<span class="dim"> to save again.</span>');
  }
  if(c==='saving'){
    const a=arg.toLowerCase();
    if(a==='off'){savingOff=true;paused=false;try{localStorage.removeItem(KEY);localStorage.setItem(NOSAVE,'1')}catch(e){}
      return say('<span class="ok">Saving is off.</span> <span class="dim">Saved names are deleted, and nothing is saved from now on, even after you reopen medtrack. Type </span>saving on<span class="dim"> to turn it back on.</span>')}
    if(a==='on'){savingOff=false;paused=false;try{localStorage.removeItem(NOSAVE)}catch(e){}save();
      return say('<span class="ok">Saving is on.</span> <span class="dim">Medication names, units and doses are saved in this browser.</span>')}
    return say('<span class="dim">Saving is </span>'+(savingOff?'off':paused?'paused until this page closes':'on')+'<span class="dim">. Type </span>saving on<span class="dim"> or </span>saving off<span class="dim">.</span>');
  }
  if(c==='undo'){
    if(!removed)return say('<span class="dim">Nothing to undo.</span>');
    const {m,i}=removed;removed=null;meds.splice(Math.min(i,meds.length),0,m);save();
    return say('<span class="ok">Brought back '+esc(m.name)+'.</span>');
  }
  if(c==='reset')return runFlow([ynStep('Delete all medications and start over?','ok')],{},x=>{if(!x.ok)return say('<span class="dim">Nothing deleted.</span>');meds=[];removed=null;save();addMed()});
  say('<span class="red">Unknown command: '+esc(c)+'.</span> Type <span class="b">help</span>.');
}

// Commands typed at the $ prompt, for ↑ and ↓. Kept only while the page is open.
const hist=[]; let hi=0, draft='';
// Notices when the date changes while the page is open, e.g. left open overnight.
let shownDay=+today();
function checkDay(fromRun){
  if(+today()===shownDay)return; shownDay=+today();
  print(''); say('<span class="dim">── it’s now </span><span class="b">'+fmt(today())+'</span><span class="dim"> ──</span>');
  if(flow)say('<span class="dim">The date changed during this question. If your answers were about yesterday, type </span>cancel<span class="dim"> and start again.</span>');
  else if(!fromRun&&meds.length)summary();
}

// Enter is handled on the input itself, so it works even where a frame blocks form submits.
function run(){
  finish();
  const v=inp.value; inp.value='';
  if(!flow&&v.trim()&&hist[hist.length-1]!==v.trim())hist.push(v.trim()); hi=hist.length;
  checkDay(true);
  print('<span class="amb">'+esc(ps.textContent)+'</span> '+esc(v),'',true); srText='';
  try{ if(flow)answer(v); else command(v); }
  catch(err){ say('<span class="red">Something went wrong: '+esc(err&&err.message||err)+'</span>'); say('<span class="dim">Your saved medications are safe. Try the command again, or type </span>cancel<span class="dim">.</span>'); }
  announce(); inp.focus();
}
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();run()}
  else if(e.key==='Escape'&&flow){e.preventDefault();inp.value='cancel';run()}
  else if(e.key==='Escape'&&typing){e.preventDefault();finish()}
  else if(e.key==='ArrowUp'&&hi>0){e.preventDefault();if(hi===hist.length)draft=inp.value;inp.value=hist[--hi]}
  else if(e.key==='ArrowDown'&&hi<hist.length){e.preventDefault();hi++;inp.value=hi===hist.length?draft:hist[hi]}
});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();if(inp.value)run()});
setInterval(()=>{try{checkDay();announce()}catch(e){}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)try{checkDay();announce()}catch(e){}});
// Keep the window the size of the visible area, so the prompt stays above the phone keyboard.
if(window.visualViewport){const vv=window.visualViewport,fit=()=>{document.documentElement.style.setProperty('--app-h',vv.height+'px');window.scrollTo(0,0);out.scrollTop=out.scrollHeight};vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit()}
// On the website, a small offline helper keeps a copy so the home-screen app opens without a connection.
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
document.getElementById('term').addEventListener('click',()=>{if(!window.getSelection().toString()){finish();inp.focus()}});

/* ---------- boot ---------- */
banner();
meds=load();
if(meds.length){try{
  say('<span class="dim">Welcome back. You have '+meds.length+' medication'+(meds.length>1?'s':'')+' saved. Schedules and amounts aren’t saved, so you enter them each time.</span>');
  print('');
  print('  <span class="amb b">begin</span>  <span class="dim">check your medications and enter today’s amounts</span>');
  print('  <span class="amb b">help</span>   <span class="dim">all commands</span>');
}catch(err){say('<span class="red">Your saved medications couldn’t be read ('+esc(err.message)+').</span> <span class="dim">Type </span>list<span class="dim"> to check them, or </span>reset<span class="dim"> to start over.</span>')}}
else{
  if(savingOff)say('<span class="dim">Saving is off, so nothing was kept from last time.</span>');
  say('<span class="dim">Add your medications and I’ll tell you when each one runs out.</span>');
  print('');
  print('  <span class="amb b">begin</span>  <span class="dim">start here: add your medications</span>');
  print('  <span class="amb b">test</span>   <span class="dim">see an example with made-up medications</span>');
  print('  <span class="amb b">help</span>   <span class="dim">all commands</span>');
}
announce();
</script>
